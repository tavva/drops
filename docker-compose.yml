services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: drops
      POSTGRES_PASSWORD: drops
      POSTGRES_DB: drops
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drops"]
      interval: 2s
      timeout: 2s
      retries: 10
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
      # Matches the S3 client's R2 region, which CreateBucket sends as its location constraint.
      RUSTFS_REGION: auto
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_OBS_PROFILING_EXPORT_ENABLED: "false"
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 2s
      retries: 10
